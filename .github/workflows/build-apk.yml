name: Build installable APK

on:
  push:
    branches:
      - onesignal-test-app
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build debug APK
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Prepare artifact
        run: cp app/build/outputs/apk/debug/app-debug.apk OneSignalTester-1.0.1-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: OneSignalTester-APK
          path: OneSignalTester-1.0.1-debug.apk
          if-no-files-found: error
          retention-days: 30
